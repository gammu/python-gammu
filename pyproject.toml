[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=61.2"
]

[dependency-groups]
dev = [
  "pytest-cov==7.1.0",
  "pytest-github-actions-annotate-failures==0.4.2",
  "pytest==9.1.1"
]

[project]
authors = [
  { email = "michal@cihar.com", name = "Michal Čihař" }
]
classifiers = [
  "Development Status :: 6 - Mature",
  "Intended Audience :: Developers",
  "Intended Audience :: Telecommunications Industry",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Operating System :: Unix",
  "Programming Language :: C",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Telephony",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Hardware"
]
description = "Gammu bindings"
keywords = [
  "calendar",
  "contact",
  "gammu",
  "mobile",
  "phone",
  "SMS",
  "todo"
]
license = "GPL-2.0-or-later"
name = "python-gammu"
requires-python = ">=3.10"
version = "3.5.1"

[project.readme]
content-type = "text/x-rst"
file = "README.rst"

[project.urls]
Documentation = "https://docs.gammu.org/python/"
Download = "https://github.com/gammu/python-gammu"
Funding = "https://wammu.eu/donate/"
Homepage = "https://github.com/gammu/python-gammu"
"Issue Tracker" = "https://github.com/gammu/python-gammu/issues"
"Source Code" = "https://github.com/gammu/python-gammu"

[tool.check-manifest]
ignore = [
  ".pre-commit-config.yaml",
  "admin/*"
]

[tool.cibuildwheel]
build = "cp3{10,11,12,13,14}-manylinux*"
test-command = "pytest test"
test-requires = ["pytest==9.1.1"]
test-sources = ["test"]

[tool.cibuildwheel.linux]
before-all = "bash {package}/.github/scripts/build-gammu-wheel.sh"
environment = { GAMMU_PATH = "/opt/python-gammu-gammu" }
manylinux-aarch64-image = "manylinux_2_28"
manylinux-x86_64-image = "manylinux_2_28"
repair-wheel-command = "auditwheel repair --strip -w {dest_dir} {wheel}"

[tool.coverage.paths]
source = [
  "."
]

[tool.coverage.report]
exclude_also = [
  "@(abc\\.)?abstractmethod",
  # Don't complain about missing debug-only code:
  "def __repr__",
  # Don't complain if non-runnable code isn't run:
  "if 0:",
  "if __name__ == .__main__.:",
  "if self\\.debug",
  # Type checking
  "if TYPE_CHECKING:",
  # Have to re-enable the standard pragma
  "pragma: no cover",
  # Don't complain if tests don't hit defensive assertion code:
  "raise AssertionError",
  "raise NotImplementedError"
]

[tool.coverage.run]
branch = true

[tool.isort]
force_grid_wrap = 0
include_trailing_comma = true
known_first_party = [
  "gammu"
]
line_length = 88
multi_line_output = 3
use_parentheses = true

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
extend-safe-fixes = [
  "ANN",
  "D",
  "f-string-in-exception",
  "FLY",
  "future-required-type-annotation",
  "raw-string-in-exception",
  "SIM",
  "TCH",
  "UP"
]
future-annotations = true
ignore = [
  "boolean-positional-value-in-call",
  "call-datetime-fromtimestamp",
  "call-datetime-without-tzinfo",
  "COM",  # CONFIG: No trailing commas
  "docstring-missing-exception",
  "docstring-missing-returns",
  "docstring-tab-indentation",  # CONFIG: formatter
  "error-suffix-on-exception-name",
  "incorrect-blank-line-before-class",  # CONFIG: incompatible with D211
  "invalid-function-name",
  "line-contains-todo",
  "line-too-long",  # WONTFIX: we accept long strings (rest is formatted by black)
  "magic-value-comparison",
  "missing-return-type-private-function",
  "missing-return-type-undocumented-public-function",
  "missing-todo-author",
  "missing-todo-link",
  "missing-type-args",
  "missing-type-function-argument",
  "missing-type-kwargs",
  "multi-line-summary-first-line",  # CONFIG: incompatible with D213
  "mutable-class-default",
  "no-self-use",
  "non-imperative-mood",
  "open-file-with-context-handler",
  "private-member-access",
  "raise-vanilla-args",
  "start-process-with-partial-path",
  "try-consider-else",
  "try-except-in-loop",  # WONFIX: affects only old Python versions
  "undocumented-public-class",
  "undocumented-public-function",
  "undocumented-public-init",
  "undocumented-public-method",
  "undocumented-public-module",
  "undocumented-public-package",
  "unused-function-argument",
  "unused-method-argument"
]
preview = true
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["print"]
"setup.py" = ["print"]
"test/*.py" = ["assert", "print"]

[tool.setuptools]
include-package-data = false
packages = [
  "gammu"
]
platforms = [
  "Linux",
  "Mac OSX",
  "Windows 95/98/ME",
  "Windows XP/2000/NT"
]

[tool.tomlsort]
ignore_case = true
sort_inline_arrays = true
sort_inline_tables = true
sort_table_keys = true
spaces_before_inline_comment = 2

[tool.typos.default]
extend-identifiers = { _O_WRONLY = "_O_WRONLY" }

[tool.typos.files]
extend-exclude = [
  "test/data/*.vcf",
  "test/data/gammu-dummy/pbk/ME/103"
]
